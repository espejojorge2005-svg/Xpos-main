services:
  - type: web
    name: xpos-backend
    env: node
    plan: free
    rootDir: pos-backend
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: TZ
        value: America/Lima
